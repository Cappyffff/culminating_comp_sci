<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/game.css">
</head>
<body>

<img class="bg" src="/static/images/landing-page.png" alt="">

<div class="game-wrapper">

    <!-- LEFT: Role card + debug -->
    <div class="col-left">

        <div class="panel role-card">
            <span class="corner corner-tl">✦</span>
            <span class="corner corner-tr">✦</span>
            <span class="corner corner-bl">✦</span>
            <span class="corner corner-br">✦</span>
            <div class="panel-titlebar">
            <span class="panel-title">Your Role</span>
            <div style="display:flex;align-items:center;gap:10px;">
                <span id="player-label" style="font-family:monospace;font-size:11px;color:#4a3a1a;">—</span>
                <button class="btn-more-info" onclick="toggleMoreInfo()" id="more-info-btn">MORE INFO</button>
            </div>
            </div>
            <div class="role-card-body">
                <div class="role-name-row">
                    <span id="rc-name" class="role-name">—</span>
                    <span id="rc-faction" class="role-faction">—</span>
                </div>
                <span id="rc-category" class="role-category">—</span>
                <p id="rc-desc" class="role-desc">Waiting for role assignment…</p>
                <div class="role-stats">
                    <div class="stat-pill">
                        <span class="stat-label">Attack</span>
                        <span class="stat-value" id="rc-atk">—</span>
                    </div>
                    <div class="stat-pill">
                        <span class="stat-label">Defense</span>
                        <span class="stat-value" id="rc-def">—</span>
                    </div>
                    <div class="stat-pill charges">
                        <span class="stat-label">Charges</span>
                        <span class="stat-value" id="rc-charges">—</span>
                    </div>
                </div>
            </div>
            <div class="more-info-body" id="more-info-body">
                <div id="debug-terminal">Waiting for role assignment…</div>
            </div>
        </div>

        <div class="panel graveyard-panel">
            <span class="corner corner-tl">✦</span>
            <span class="corner corner-tr">✦</span>
            <span class="corner corner-bl">✦</span>
            <span class="corner corner-br">✦</span>
            <div class="panel-titlebar">
                <span class="panel-title">Graveyard</span>
                <span id="dead-count" style="font-family:monospace;font-size:11px;color:#4a3a1a;">—</span>
            </div>
            <div class="graveyard-body" id="graveyard-list">
                <div class="player-placeholder">No deaths yet</div>
            </div>
        </div>

    </div>

<div id="action-panel" style="display:none">
</div>

<div id="feedback-panel" style="display:none">
    <div class="feedback-header">Last Night's Results</div>
    <div id="feedback-list"></div>
</div>
    <div class="col-centre">

        <div class="panel phase-bar">
            <span class="corner corner-tl">✦</span>
            <span class="corner corner-tr">✦</span>
            <span class="corner corner-bl">✦</span>
            <span class="corner corner-br">✦</span>
            <div class="phase-bar-body">
                <div style="display:flex;flex-direction:column;gap:4px;">
                    <span id="phase-label" class="phase-label">Day 1</span>
                    <span id="phase-sub"   class="phase-sub">—</span>
                </div>
                <span id="phase-timer" class="phase-timer">—</span>
            </div>
        </div>

        <div class="panel player-list-panel">
            <span class="corner corner-tl">✦</span>
            <span class="corner corner-tr">✦</span>
            <span class="corner corner-bl">✦</span>
            <span class="corner corner-br">✦</span>
            <div class="panel-titlebar">
                <span class="panel-title">Players</span>
                <span id="living-count" style="font-family:monospace;font-size:11px;color:#4a3a1a;">—</span>
            </div>
            <div class="player-list-body" id="player-list">
                <div class="player-placeholder">Waiting for players…</div>
            </div>
        </div>

    </div>

    <!-- RIGHT: Action panel + coven chat -->
    <div class="col-right">

        <div class="panel action-panel">
            <span class="corner corner-tl">✦</span>
            <span class="corner corner-tr">✦</span>
            <span class="corner corner-bl">✦</span>
            <span class="corner corner-br">✦</span>
            <div class="panel-titlebar">
                <span class="panel-title">Action</span>
            </div>
            <div class="action-body">
                <div class="action-placeholder">No action available</div>
            </div>
        </div>

        <div class="panel coven-chat-panel" id="coven-chat-panel" style="display:none;">
            <span class="corner corner-tl">✦</span>
            <span class="corner corner-tr">✦</span>
            <span class="corner corner-bl">✦</span>
            <span class="corner corner-br">✦</span>
            <div class="panel-titlebar">
                <span class="panel-title" style="color:#b06adf;">Coven</span>
            </div>
            <div class="coven-chat-body">
                <div class="coven-messages" id="coven-messages">
                    <div class="coven-msg-placeholder">Night only</div>
                </div>
                <div class="coven-input-row">
                    <input class="coven-input" id="coven-input" type="text"
                           placeholder="Message coven…" disabled
                           onkeydown="if(event.key==='Enter') sendCovenMessage()">
                    <button class="btn-wood" onclick="sendCovenMessage()" id="coven-send-btn" disabled>Send</button>
                </div>
            </div>
        </div>

    </div>

</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="/static/js/game.js"></script>
</body>
</html>
